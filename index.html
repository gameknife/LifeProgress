<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Life Progress</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="app" class="app-panel">
      <header id="drag-handle">
        <div class="identity"><h1>LIFE PROGRESS</h1><span>90 years. One life.</span></div>
        <div class="edit-controls">
          <select id="display-scale" aria-label="显示大小"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select>
          <label class="birth-label"><span>出生日期</span><input id="birth-date" type="date" min="1900-01-01" aria-label="出生日期" /></label>
          <button id="done-button" class="accent" title="保存并返回静默 · ESC">完成 <kbd>esc</kbd></button>
        </div>
      </header>
      <div id="notice" class="notice" role="alert" hidden><span id="notice-text"></span><button id="recover-button" type="button" hidden>恢复数据</button></div>
      <div class="calendar"><canvas id="weeks" tabindex="0" role="img" aria-label="52 行、90 列的人生周历"></canvas></div>
      <footer>
        <p class="progress"><span id="remaining">— / — weeks</span><span class="separator">·</span><span id="percent">—%</span></p>
        <div class="footer-meta"><span id="life-caption">Ctrl+Alt+L · 设置出生日期</span><span class="edit-controls" id="mark-count">0 个标记</span></div>
        <p class="edit-controls help">点击一周，留下一件值得记住的事。</p>
      </footer>
    </main>
    <div id="week-tooltip" role="tooltip" hidden></div>
    <dialog id="editor" class="week-editor" aria-labelledby="editor-heading">
      <form id="milestone-form">
        <div class="dialog-heading"><h2 id="editor-heading"></h2><button id="close-editor" type="button" class="icon-button" aria-label="保存并关闭编辑">×</button></div>
        <p id="editor-date" class="muted"></p>
        <label>标题<input id="mark-title" name="title" maxlength="120" placeholder="大学毕业、第一次远行…" autocomplete="off" /></label>
        <label>备忘<textarea id="mark-details" name="details" maxlength="4000" rows="3" placeholder="记下此刻，或期待未来。"></textarea></label>
        <label>节点颜色<input id="mark-color" type="color" value="#FACC15" /></label>
        <div class="dialog-actions"><button id="delete-mark" type="button" class="danger" hidden>删除标记</button><button type="submit" class="primary">保存标记</button></div>
      </form>
    </dialog>
  </body>
</html>
