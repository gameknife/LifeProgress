<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Life Progress</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="app" class="app-panel">
      <header id="drag-handle">
        <div class="identity"><h1>LIFE PROGRESS</h1><span>90 years. One life.</span></div>
        <div class="edit-controls">
          <button id="settings-button" aria-label="设置出生日期" title="设置">设置</button>
          <button id="done-button" class="accent" title="保存并返回静默 · ESC">完成 <kbd>esc</kbd></button>
        </div>
      </header>
      <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="recover-button" hidden>恢复数据</button></div>
      <div class="calendar"><canvas id="weeks" tabindex="0" role="img" aria-label="90 行、52 列的人生周历"></canvas><div id="current-glow" aria-hidden="true" hidden></div></div>
      <footer>
        <p class="progress"><span id="remaining">—w left</span><span class="separator">·</span><span id="percent">—%</span></p>
        <div class="footer-meta"><span id="life-caption">Ctrl+Alt+L · 设置出生日期</span><span class="edit-controls" id="mark-count">0 个标记</span></div>
        <p class="edit-controls help">点击一周，留下一件值得记住的事。</p>
      </footer>
    </main>
    <div id="tooltip" role="tooltip" hidden></div>
    <dialog id="editor" class="week-editor" aria-labelledby="editor-heading">
      <form id="milestone-form">
        <div class="dialog-heading"><h2 id="editor-heading"></h2><button id="close-editor" type="button" class="icon-button" aria-label="保存并关闭编辑">×</button></div>
        <p id="editor-date" class="muted"></p>
        <label>标题<input id="mark-title" name="title" maxlength="120" placeholder="大学毕业、第一次远行…" autocomplete="off" /></label>
        <label>备忘<textarea id="mark-details" name="details" maxlength="4000" rows="3" placeholder="记下此刻，或期待未来。"></textarea></label>
        <label>类型<select id="mark-kind" name="kind"><option value="milestone">过去里程碑</option><option value="wish">未来心愿</option></select></label>
        <fieldset><legend>节点颜色</legend><div id="swatches" class="swatches"></div><label class="custom-color">自定义<input id="mark-color" type="color" value="#FACC15" aria-label="自定义节点颜色" /></label></fieldset>
        <p id="editor-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="delete-mark" type="button" class="danger" hidden>删除标记</button><button type="submit" class="primary">保存标记</button></div>
      </form>
    </dialog>
    <dialog id="settings" class="settings-dialog" aria-labelledby="settings-heading">
      <form id="settings-form">
        <div class="dialog-heading"><h2 id="settings-heading">你的人生周历</h2><button id="close-settings" type="button" class="icon-button" aria-label="取消设置">×</button></div>
        <p class="muted intro">每一个点，是生命里的一个星期。横向每列一岁，纵向每行一岁。</p>
        <label>出生日期<input id="birth-date" name="birthDate" type="date" min="1900-01-01" required /></label>
        <div class="target-age"><span>人生尺度</span><strong>90 岁 · 4,680 周</strong></div>
        <label>布局方向<select id="orientation"><option value="horizontal">横向 · 90 列 × 52 行</option><option value="vertical">纵向 · 52 列 × 90 行</option></select></label>
        <label>显示比例<select id="display-scale"><option value="small">小</option><option value="medium">中（默认）</option><option value="large">大</option></select></label>
        <p class="muted">保存后调整点阵和窗口大小，自动适配屏幕可用空间。</p>
        <label class="checkbox"><input id="centered" type="checkbox" checked />保持屏幕居中</label>
        <p class="muted">启动、保存设置和返回静默时自动居中；关闭后可拖动并保存位置。</p>
        <label class="checkbox"><input id="breathing" type="checkbox" checked />当前周呼吸光晕</label>
        <p class="muted">关闭光晕后，静默时仅在日期和数据变化时重绘。</p>
        <p class="muted small">每岁固定 52 格，按相邻生日之间的日期均分；2 月 29 日在平年按 2 月 28 日计算。</p>
        <p id="data-path" class="data-path"></p>
        <p id="settings-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button type="submit" class="primary">保存设置</button></div>
      </form>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <button id="preview-wake" hidden>编辑预览</button>
  </body>
</html>
